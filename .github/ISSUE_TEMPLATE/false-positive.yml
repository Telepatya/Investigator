name: False positive
description: Report a deterministic detection that fires on verified benign activity.
title: "[False positive]: "
labels: ["false positive", "detection", "validation"]
body:
  - type: markdown
    attributes:
      value: "Do not post real evidence. A false positive must be reproducible with synthetic or fully sanitized records."
  - type: input
    id: finding
    attributes:
      label: Finding title or rule
    validations:
      required: true
  - type: textarea
    id: benign
    attributes:
      label: Why the activity is benign
      description: Explain how the behavior was independently verified and identify the legitimate software or workflow.
    validations:
      required: true
  - type: textarea
    id: signals
    attributes:
      label: Triggering signals
      description: List the sanitized fields, process relationship, command line, or correlation that caused the finding.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized reproducer
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Investigator version or commit
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I verified this is a deterministic finding, not only an AI-generated statement.
          required: true
        - label: I followed docs/TEST_FIXTURES.md and removed all real case identifiers and secrets.
          required: true
        - label: I included enough benign context to avoid broadly suppressing genuinely suspicious behavior.
          required: true
