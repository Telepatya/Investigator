name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy and release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate label definitions
        run: python .github/scripts/sync_labels.py --check

      - name: Generate and parse deterministic SBOM
        run: |
          python scripts/generate_sbom.py --version v0.0.0 --output sbom-test.json
          python -m json.tool sbom-test.json > /dev/null

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # A direct dependency added to requirements.in but missing from the locks is
      # invisible to every other step: installs run --require-hashes --no-deps, so
      # they silently omit it and the backend only fails at import time on a user's
      # machine. Recompile each lock in place and fail on any difference.
      - name: Check dependency locks are current
        run: |
          python -m pip install uv
          # Recompile in place, exactly as scripts/update-locks.sh does, then let git
          # report any change. Compiling to a temporary path instead would always
          # differ, because uv records the -o argument in the file header.
          # uv preserves the pins already in each lock, so this reports drift from
          # requirements.in rather than failing on every unrelated upstream release.
          ./scripts/update-locks.sh
          if ! git diff --exit-code -- requirements.lock requirements-memory.lock requirements-dev.lock; then
            echo "::error file=backend/requirements.in::Dependency locks are out of date. Run backend/scripts/update-locks.sh and commit the result."
            exit 1
          fi

      - name: Install locked dependencies
        run: >
          python -m pip install
          --require-hashes
          --no-deps
          -r requirements-dev.lock

      - name: Verify locked dependency closure
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run Ruff
        run: ruff check app tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        run: pip-audit -r requirements.lock

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies
        run: npm audit --audit-level=critical

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
